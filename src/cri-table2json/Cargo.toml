[package]
name = "cri-table2json"
description = "A tool to see the entire CriTable content in a convenient way"
version = "1.1.0"
edition = "2024"
authors = ["Oleg \"OSA413\" Sokolov", "Skyth"]
repository = "https://github.com/OSA413/CriTableTools"
homepage = "https://github.com/OSA413/CriTableTools"
license = "MIT"

[dependencies]
cri-table = { path = "../cri-table" }
common_binary = { path = "../../src_tools/src/common/binary" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151" }

[lints]
workspace = true
