[package]
name = "cri-table"
description = "A low level crate to manipulate CriTable"
version = "1.3.0"
edition = "2024"
authors = ["Oleg \"OSA413\" Sokolov", "Skyth"]
repository = "https://github.com/OSA413/CriTableTools"
homepage = "https://github.com/OSA413/CriTableTools"
license = "MIT"

[dependencies]
common_binary = { path = "../../src_tools/src/common/binary" }
bitflags = { version = "2.13.2" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151" }
sha2 = "0.11.1"
itertools = "0.15.0"

[lints]
workspace = true
